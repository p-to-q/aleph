name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install Node dependencies
        run: npm ci
      - name: Install API dependencies
        run: |
          python -m venv apps/api/.venv
          apps/api/.venv/bin/python -m pip install --upgrade pip
          apps/api/.venv/bin/python -m pip install -e 'apps/api[test]'
      - name: Repository checks
        run: npm run lint
      - name: Core and contract tests
        run: npm test
      - name: Production web build
        run: npm --workspace web run build
      - name: API compile and unit tests
        run: |
          apps/api/.venv/bin/python -m compileall apps/api/aleph_api
          PYTHONPATH=apps/api apps/api/.venv/bin/python -m pytest apps/api/tests -q
      - name: Mock API smoke
        run: npm run api:smoke

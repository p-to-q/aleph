name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install Node dependencies
        run: npm ci
      - name: Install API dependencies
        run: |
          python -m venv apps/api/.venv
          apps/api/.venv/bin/python -m pip install --upgrade pip
          apps/api/.venv/bin/python -m pip install -e 'apps/api[test]'
      - name: Repository checks
        run: npm run lint
      - name: Core and contract tests
        run: npm test
      - name: Production web build
        run: npm --workspace web run build
      - name: API compile and unit tests
        run: |
          apps/api/.venv/bin/python -m compileall apps/api/aleph_api
          PYTHONPATH=apps/api apps/api/.venv/bin/python -m pytest apps/api/tests -q
      - name: Mock API smoke
        run: npm run api:smoke
